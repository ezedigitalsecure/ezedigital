        .hamburger-circle {

            border-radius: 50%;
            background: rgba(0, 12, 14, 0.75);
            border: 1px solid rgba(0, 184, 187, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 184, 187, 0.1);
        }

        .hamburger-circle:hover {
            background: rgba(0, 24, 28, 0.9);
            box-shadow: 0 0 20px rgba(0, 184, 187, 0.3);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .hamburger span {
            width: 26px;
            height: 3px;
            background: linear-gradient(90deg, #00B8BB, #00E6E9);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 184, 187, 0.6);
            transition: all 0.3s ease;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        .dropdown-menu {
            position: absolute;
            top: 62px;
            right: 0;
            background: rgba(0, 24, 28, 0.96);
            border: 1px solid rgba(0, 184, 187, 0.35);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 0 25px rgba(0, 184, 187, 0.25);
            min-width: 220px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .dropdown-menu.open {
            display: flex;
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-link {
            color: #e6f7f8 !important;
            text-decoration: none;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 184, 187, 0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .dropdown-link:hover,
        .dropdown-link.active {
            background: rgba(0, 184, 187, 0.15);
            color: #00E6E9 !important;
            padding-left: 1.8rem;
        }

        .dropdown-link:last-child {
            border-bottom: none;
        }

        .btn {

            font-weight: 500;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(0, 184, 187, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);

        }

            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .scrollable-pages.active {

        }

        .page-wrapper {

        .tab-content {

        .tab-content.active {
            display: block;

        }

        @keyframes fadeIn {

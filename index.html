<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eze Digital — Secure & Evolve</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action 'self' https://formspree.io;">
    
    <link rel="stylesheet" href="footerstyles.css?v=3">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        
        .static-canvas {
            position: absolute;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            background:
                url('mockup-bg.png') no-repeat center center,
                linear-gradient(180deg, #001418 0%, #00222a 45%, #001115 100%);
            background-size: cover;
        }
        
        header {
            position: absolute;
            top: 0; right: 0;
            padding: 1.5rem 2.5rem;
            z-index: 100;
        }
        
        .scrollable-pages {
            position: absolute;
            inset: 0;
            width: 100vw; height: 100vh;
            z-index: 50;
            overflow-y: auto;
            background: transparent;
        }
        
        .page-content {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 4rem;
        }
        
        .hero-box {
            width: 92%;
            max-width: 900px;
            padding: 3rem 4rem;
            text-align: center;
            background: rgba(0, 8, 10, 0.85);
            border-radius: 14px;
            border: 1px solid rgba(0, 184, 187, 0.2);
        }
        
        .hero-box h1 {
            color: #00E6E9;
            font-size: 2.6rem;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }
        
        .hero-tagline {
            color: #66F0F3;
            font-size: 1.25rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            font-style: italic;
        }
        
        .hero-desc {
            color: #99E6E8;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-inline: auto;
        }
        
        .btn {
            background: linear-gradient(90deg, #00E6E9, #00B8BB);
            color: #001418;
            font-weight: bold;
            padding: 0.85rem 2.4rem;
            border-radius: 28px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            box-shadow: 0 0 15px rgba(0, 230, 233, 0.5);
            transform: scale(1.05);
        }
        
        #footer-placeholder {
            position: relative;
            z-index: 50;
        }
        
        @media (max-width: 768px) {
            header { padding: 1rem 1.2rem; }
            .hero-box { padding: 2rem 1.8rem; }
            .hero-box h1 { font-size: 2rem; }
        }
        
        @media (max-width: 480px) {
            .hero-box { padding: 1.5rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="static-canvas"></div>
    
    <header>
        <div id="nav-container"></div>
    </header>
    
    <div class="scrollable-pages">
        <div class="page-content">
            <div class="hero-box">
                <h1>Welcome to Eze Digital</h1>
                <p class="hero-tagline">Where heart meets HTML<br>your partner in creating your secure online home</p>
                <p class="hero-desc">We build beautiful protected digital foundations that feel like you and grow with you. From website design to cybersecurity and training — everything crafted with care.</p>
                <a href="contact.html" class="btn">Let's Talk</a>
            </div>
        </div>
        
        <div id="footer-placeholder"></div>
    </div>
    
    <!-- FETCH NAV MENU from nav-menu.html -->
    <script>
        fetch('nav-menu.html')
            .then(res => { if (!res.ok) throw new Error('nav-menu.html missing'); return res.text(); })
            .then(html => {
                document.getElementById('nav-container').innerHTML = html;
                // Attach toggle after menu loads
                setTimeout(() => {
                    const circle = document.querySelector('.hamburger-circle');
                    const hamburger = document.getElementById('hamburger');
                    const dropdown = document.getElementById('dropdownMenu');
                    if (circle) {
                        circle.addEventListener('click', () => {
                            hamburger?.classList.toggle('open');
                            dropdown?.classList.toggle('open');
                        });
                    }
                    // Auto-highlight active page
                    const current = location.pathname.split('/').pop() || 'index.html';
                    document.querySelectorAll('.dropdown-link').forEach(link => {
                        if (link.getAttribute('href') === current) link.classList.add('active');
                    });
                }, 0);
            })
            .catch(err => console.error('Nav load error:', err));
    </script>
    
    <!-- FETCH FOOTER from footer.html -->
    <script>
        fetch('footer.html')
            .then(res => { if (!res.ok) throw new Error('footer.html missing'); return res.text(); })
            .then(html => { document.getElementById('footer-placeholder').innerHTML = html; })
            .catch(err => console.error('Footer load error:', err));
    </script>
</body>
</html>

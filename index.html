<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eze Digital Ltd — Secure & Evolve</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box;}

        /* 🎨 EXACT MOCKUP COLOURS */
        :root {
            --deep-navy: #021020;
            --teal-dark: #0A3040;
            --teal-mid: #009999;
            --teal-bright: #00DDDD;
            --teal-glow: rgba(0,221,221,0.6);
            --cyan: #00FFFF;
            --text-white: #FFFFFF;
            --text-soft: #B0E0E0;
            --circuit-line: rgba(0,221,221,0.35);
            --circuit-dot: rgba(0,255,255,0.9);
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: radial-gradient(ellipse at top left, #0A2A38 0%, var(--deep-navy) 60%, #000810 100%);
            color: var(--text-white);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* ⚡ EXACT CIRCUIT BOARD BACKGROUND — MOCKUP STYLE */
        .circuit-bg {
            position: fixed;
            top:0; left:0;
            width:100%; height:100%;
            background-image: 
                radial-gradient(circle at 10% 15%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 30% 25%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 50% 10%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 70% 20%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 90% 15%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 20% 50%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 80% 45%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 40% 80%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 60% 85%, var(--circuit-dot) 2px, transparent 2px),
                radial-gradient(circle at 15% 90%, var(--circuit-dot) 2px, transparent 2px),
                linear-gradient(45deg, transparent 48%, var(--circuit-line) 49%, var(--circuit-line) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, var(--circuit-line) 49%, var(--circuit-line) 51%, transparent 52%);
            background-size: 
                20% 20%, 20% 20%, 20% 20%, 20% 20%, 20% 20%,
                20% 20%, 20% 20%, 20% 20%, 20% 20%, 20% 20%,
                120px 120px, 120px 120px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.8;
        }

        /* 💫 CENTRAL GLOW ORB behind logo chip */
        .central-glow {
            position:fixed;
            top:15%; right:8%;
            width:450px; height:450px;
            background: radial-gradient(circle, rgba(0,255,255,0.18) 0%, rgba(0,180,180,0.06) 40%, transparent 70%);
            border-radius:50%;
            filter: blur(40px);
            pointer-events:none;
            z-index:2;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 3rem;
            position: relative;
            z-index: 10;
        }

        /* 🧠 HEADER — EXACT MOCKUP LAYOUT */
        header {
            padding: 2rem 3rem;
            position: relative;
            z-index: 50;
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .logo-wrap img {
            height: 55px;
            width: auto;
            filter: drop-shadow(0 0 20px rgba(0,221,221,0.5));
        }
        .logo-text h1 {
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--text-white);
            letter-spacing: 0.8px;
        }
        .logo-text p {
            font-size: 0.75rem;
            color: var(--teal-bright);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0.15rem;
        }
        nav a {
            color: var(--text-white);
            text-decoration: none;
            margin-left: 2.2rem;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            opacity: 0.9;
            transition: all 0.3s;
        }
        nav a:hover {
            opacity: 1;
            color: var(--teal-bright);
            text-shadow: 0 0 10px var(--teal-glow);
        }
        nav a.contact-btn {
            background: rgba(0,150,150,0.25);
            border: 1px solid rgba(0,221,221,0.35);
            padding: 0.55rem 1.4rem;
            border-radius: 6px;
            margin-left: 1.5rem;
            transition: all 0.3s;
        }
        nav a.contact-btn:hover {
            background: rgba(0,200,200,0.35);
            box-shadow: 0 0 15px rgba(0,221,221,0.25);
        }

        /* 🛡️ HERO SECTION — EXACT MOCKUP */
        .hero {
            padding: 3rem 3rem 8rem;
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            min-height: 70vh;
        }
        .hero-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 4rem;
            align-items: center;
        }
        .hero-content h2 {
            font-size: 3.4rem;
            line-height: 1.15;
            font-weight: 600;
            margin-bottom: 1.8rem;
            color: var(--text-white);
            letter-spacing: 0.5px;
        }
        .hero-content p {
            font-size: 1.1rem;
            max-width: 480px;
            color: var(--text-soft);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00AAAA 0%, #00CCCC 100%);
            color: var(--text-white);
            font-weight: 600;
            font-size: 1rem;
            padding: 0.95rem 2.4rem;
            border-radius: 25px;
            border: none;
            box-shadow: 0 0 20px rgba(0,200,200,0.35);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0,221,221,0.5);
        }

        /* 💠 GLOWING LOGO CHIP — THE BIG E ON RIGHT */
        .hero-chip {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .chip-outer {
            width: 380px;
            height: 380px;
            position: relative;
        }
        .chip-package {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 260px; height: 260px;
            background: linear-gradient(135deg, rgba(0,60,80,0.85) 0%, rgba(0,100,110,0.75) 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 40px rgba(0,221,221,0.35),
                inset 0 0 30px rgba(0,255,255,0.1);
            border: 2px solid rgba(0,221,221,0.5);
        }
        .chip-logo {
            width: 160px; height: 160px;
            background: linear-gradient(135deg, #00AAAA 0%, #00EEEE 100%);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 30px rgba(0,255,255,0.6),
                inset 0 0 20px rgba(255,255,255,0.2);
            position: relative;
        }
        .chip-logo span {
            font-size: 5.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            margin-top: -5px;
        }
        /* CHIP PINS — top & bottom */
        .pins-top, .pins-bot {
            position:absolute;
            left:50%; transform:translateX(-50%);
            display:flex; gap:10px;
        }
        .pins-top { top:10px; }
        .pins-bot { bottom:10px; }
        .pin {
            width:12px; height:20px;
            background: linear-gradient(180deg, #88FFFF 0%, #00AAAA 100%);
            border-radius: 2px 2px 0 0;
            box-shadow: 0 0 6px rgba(0,255,255,0.6);
        }
        .pins-bot .pin { border-radius: 0 0 2px 2px; }

        /* 📱 RESPONSIVE */
        @media (max-width: 1100px) {
            .hero-inner { grid-template-columns: 1fr; text-align:center; }
            .hero-content p { margin:0 auto 2.5rem; }
            .hero-chip { margin-top: 2rem; }
        }
    </style>
</head>
<body>

    <!-- ⚡ BACKGROUND LAYERS -->
    <div class="circuit-bg"></div>
    <div class="central-glow"></div>

    <!-- 🧠 HEADER -->
    <header>
        <div class="header-inner">
            <div class="logo-wrap">
                <img src="logo.png" alt="Eze Digital Ltd — Secure & Evolve">
                <div class="logo-text">
                    <h1>EZE DIGITAL</h1>
                    <p>Secure & Evolve</p>
                </div>
            </div>
            <nav>
                <a href="#home">Home</a>
                <a href="#services">Services</a>
                <a href="#about">About</a>
                <a href="#contact" class="contact-btn">Contact</a>
            </nav>
        </div>
    </header>

    <!-- 🛡️ HERO SECTION -->
    <section class="hero" id="home">
        <div class="container">
            <div class="hero-inner">
                <div class="hero-content">
                    <h2>Secure Your Digital Future</h2>
                    <p>Professional cybersecurity assessments, GDPR compliance frameworks, and digital trust solutions — built to protect, designed to evolve.</p>
                    <a href="#contact" class="btn">Get in Touch</a>
                </div>
                <div class="hero-chip">
                    <div class="chip-outer">
                        <div class="chip-package">
                            <div class="pins-top">
                                <div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div>
                            </div>
                            <div class="chip-logo"><span>E</span></div>
                            <div class="pins-bot">
                                <div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div><div class="pin"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ⏳ Services section coming in CHUNK 2 -->

</body>
</html>

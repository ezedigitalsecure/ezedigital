        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background:
                url('mockup-bg.png') no-repeat top center fixed,
                linear-gradient(180deg, #001418 0%, #00222a 45%, #001115 100%);
            background-size: cover, 100% 100%;
            background-attachment: fixed;
            color: #fff;
        }

        /* === HEADER — No top bar, only hamburger === */
        header {
            padding: 1.2rem 2.5rem;
            position: fixed;
            top: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
            background: transparent;
        }

        /* === HAMBURGER — Top Right, Dark Circle Background === */
        .menu-wrapper {
            position: relative;
        }

        .hamburger-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(0, 12, 14, 0.75);
            border: 1px solid rgba(0, 184, 187, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 184, 187, 0.1);
        }

        .hamburger-circle:hover {
            background: rgba(0, 24, 28, 0.9);
            box-shadow: 0 0 20px rgba(0, 184, 187, 0.3);
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 0.3rem;
        }

        .hamburger span {
            width: 26px;
            height: 3px;
            background: linear-gradient(90deg, #00B8BB, #00E6E9);
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(0, 184, 187, 0.6);
            transition: all 0.3s ease;
        }

        /* Hamburger → X animation */
        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(6px, 6px);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -6px);
        }

        /* === DROPDOWN MENU === */
        .dropdown-menu {
            position: absolute;
            top: 62px;
            right: 0;
            background: rgba(0, 24, 28, 0.96);
            border: 1px solid rgba(0, 184, 187, 0.35);
            border-radius: 0 0 12px 12px;
            box-shadow: 0 0 25px rgba(0, 184, 187, 0.25);
            min-width: 220px;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .dropdown-menu.open {
            display: flex;
            animation: slideDown 0.25s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-link {
            color: #e6f7f8;
            text-decoration: none;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border-bottom: 1px solid rgba(0, 184, 187, 0.1);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .dropdown-link:hover,
        .dropdown-link.active {
            background: rgba(0, 184, 187, 0.15);
            color: #00E6E9;
            padding-left: 1.8rem;
        }

        .dropdown-link:last-child {
            border-bottom: none;
        }

        /* === PAGE CONTENT === */
        .page-wrapper {
            padding: 10rem 2rem 3rem;
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* === HOME — Darker but see-through box === */
        .home-content {
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
            background: rgba(0, 8, 10, 0.78);
            padding: 2.8rem;
            border-radius: 16px;
            border: 1px solid rgba(0, 184, 187, 0.18);
            box-shadow: 0 0 35px rgba(0, 184, 187, 0.08);
            backdrop-filter: blur(6px);
        }

        .home-content h2 {
            font-size: 2.6rem;
            color: #ffffff;
            margin-bottom: 1.5rem;
            line-height: 1.25;
        }

        .home-content p {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #d4ecec;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00777A, #00B8BB);
            color: white;
            padding: 0.9rem 2.2rem;
            border-radius: 28px;
            text-decoration: none;
            font-weight: 500;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px rgba(0, 184, 187, 0.3);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 184, 187, 0.5);
        }

            display: none;
        }

            display: block;
            animation: fadeIn 0.4s ease;
        }

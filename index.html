<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eze Digital — Secure and Evolve</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://formspree.io; font-src 'self'; base-uri 'self'; frame-src 'none'; object-src 'none'; form-action 'self' https://formspree.io;">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Footer styles — ONE line -->
    <link rel="stylesheet" href="footerstyles.css">

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}
html,
body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
.static-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    overflow: hidden;
    background:
        url('mockup-bg.png') no-repeat center center,
        linear-gradient(180deg, #001418 0%, #00222a 45%, #001115 100%);
    background-size: cover;
    background-attachment: scroll;
}
header {
    position: absolute;
    top: 0;
    right: 0;
    padding: 1.5rem 2.5rem;
    z-index: 100;
    display: flex;
    justify-content: flex-end;
    background: transparent;
}
.menu-wrapper { position: relative; }
.hamburger-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(0, 12, 14, 0.75);
    border: 1px solid rgba(0, 184, 187, 0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    z-index: 100;
}
.hamburger {
    display: flex;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    z-index: 9999;
    pointer-events: auto;
}
.hamburger span {
    width: 26px;
    height: 3px;
    background: linear-gradient(90deg, #00B8BB, #00E6E9);
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(0, 184, 187, 0.6);
    transition: all 0.3s ease;
    pointer-events: none;
}
.hamburger:hover span {
    filter: drop-shadow(0 0 8px rgba(0, 230, 233, 0.9)) drop-shadow(0 0 16px rgba(0, 230, 233, 0.6));
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }
.dropdown-menu {
    position: absolute;
    top: 62px;
    right: 0;
    background: rgba(0, 24, 28, 0.96);
    border: 1px solid rgba(0, 184, 187, 0.35);
    border-radius: 0 0 12px 12px;
    min-width: 220px;
    display: none;
    flex-direction: column;
}
.dropdown-menu.open { display: flex; }
.dropdown-link {
    color: #00B8BB !important;
    font-weight: bold;
    padding: 1rem 1.5rem;
    text-decoration: none;
    border-bottom: 1px solid rgba(0, 184, 187, 0.1);
    cursor: pointer;
}
.dropdown-link:hover,
.dropdown-link.active {
    color: #00E6E9 !important;
    background: transparent;
}
.home-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 2.8rem;
    max-width: 640px;
    width: 90%;
    text-align: center;
    background: rgba(0, 8, 10, 0.78);
    border-radius: 16px;
    border: 1px solid rgba(0, 184, 187, 0.18);
    z-index: 30;
}
.home-box h1 {
    color: #00E6E9;
    font-size: 2.6rem;
    margin-bottom: 0.5rem;
}
.home-box p {
    color: #00B8BB;
    font-size: 1.2rem;
    line-height: 1.8;
    margin-bottom: 2rem;
}
.home-box p span {
    display: block;
}
.btn {
    background: linear-gradient(90deg, #00E6E9, #00B8BB);
    color: #001418;
    font-weight: bold;
    padding: 0.9rem 2.2rem;
    border-radius: 28px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
}
.btn:hover {
    background: linear-gradient(90deg, #00E6E9, #00E6E9);
    box-shadow: 0 0 20px rgba(0, 230, 233, 0.7), 0 0 40px rgba(0, 230, 233, 0.4);
    transform: scale(1.05);
}
.scrollable-pages {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 50;
    overflow-y: auto;
    background:
        url('mockup-bg.png') no-repeat center center fixed,
        linear-gradient(180deg, #001418 0%, #00222a 45%, #001115 100%);
    background-size: cover;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}
.scrollable-pages.active { opacity: 1; pointer-events: auto; }
.page-wrapper {
    padding: 6rem 2rem 0;
    max-width: 850px;
    margin: 0 auto;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
@media (max-width: 768px) {
    header { padding: 1rem 1.2rem; }
    .home-box h1 { font-size: 1.9rem; }
    .page-wrapper { padding: 5rem 1.2rem 0; }
}
.hamburger-circle {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
}
.hamburger {
    position: relative !important;
    top: auto !important;
    right: auto !important;
    margin: 0 !important;
}
.dropdown-link {
    pointer-events: auto !important;
    position: relative !important;
    z-index: 99999 !important;
}
.btn {
    pointer-events: auto !important;
    position: relative !important;
    z-index: 99999 !important;
}
    </style>
</head>
<body>
    <div class="static-canvas"></div>
    <header>
        <div class="menu-wrapper">
            <div class="hamburger-circle" id="hamburgerCircle" style="pointer-events: none;">
                <div class="hamburger" id="hamburger" style="position: relative; z-index: 99999; pointer-events: auto;">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <nav class="dropdown-menu" id="dropdownMenu">
                <a class="dropdown-link active" data-page="home" onclick="switchTab('home')">Home</a>
                <a class="dropdown-link" data-page="services" onclick="switchTab('services')">Services</a>
                <a class="dropdown-link" data-page="about" onclick="switchTab('about')">About</a>
                <a class="dropdown-link" data-page="contact" onclick="switchTab('contact')">Contact</a>
                <a class="dropdown-link" onclick="alert('Coming soon')">Client Portal</a>
            </nav>
        </div>
    </header>

    <!-- HOME TAB -->
    <div id="home" class="tab-content active">
        <div class="home-box">
            <h1>Welcome to Eze Digital</h1>
            <p>Heart meets HTML
            <span>Your partner in creating your secure online home</span></p>
            <button class="btn" onclick="switchTab('services')">Find Out More</button>
        </div>
    </div>

    <!-- SCROLLABLE PAGES -->
    <div class="scrollable-pages" id="scrollablePages">
        <!-- SERVICES TAB -->
        <div id="services" class="tab-content">
            <div class="page-wrapper">
                <h2 style="color:#00E6E9; font-size:2rem; margin-bottom:1rem;">Our Services</h2>
                <p style="color:#99E6E8; line-height:1.8;">This is where your services content will go.</p>
            </div>
            <!-- ✅ FOOTER FETCH — outside wrapper = FULL WIDTH -->
            <div id="footer-here"></div>
            <script>
            document.addEventListener('DOMContentLoaded', () => {
              fetch('footer.html')
                .then(r => r.text())
                .then(html => { document.getElementById('footer-here').innerHTML = html; })
                .catch(e => console.error('Footer load error:', e));
            });
            </script>
        </div>

        <!-- ABOUT TAB -->
        <div id="about" class="tab-content">
            <div class="page-wrapper">
                <h2 style="color:#00E6E9; font-size:2rem; margin-bottom:1rem;">About Us</h2>
                <p style="color:#99E6E8; line-height:1.8;">About content will appear here.</p>
            </div>
            <div id="footer-here"></div>
            <script>
            document.addEventListener('DOMContentLoaded', () => {
              fetch('footer.html')
                .then(r => r.text())
                .then(html => { document.getElementById('footer-here').innerHTML = html; })
                .catch(e => console.error('Footer load error:', e));
            });
            </script>
        </div>

        <!-- CONTACT TAB -->
        <div id="contact" class="tab-content">
            <div class="page-wrapper">
                <h2 style="color:#00E6E9; font-size:2rem; margin-bottom:1rem;">Get In Touch</h2>
                <p style="color:#99E6E8; line-height:1.8;">Email: secure@ezedigital.co.uk</p>
            </div>
            <div id="footer-here"></div>
            <script>
            document.addEventListener('DOMContentLoaded', () => {
              fetch('footer.html')
                .then(r => r.text())
                .then(html => { document.getElementById('footer-here').innerHTML = html; })
                .catch(e => console.error('Footer load error:', e));
            });
            </script>
        </div>
    </div><!-- .scrollable-pages ends -->

    <script>
document.addEventListener('DOMContentLoaded', function () {
  window.switchTab = function(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => {
      tab.classList.remove('active');
    });
    const targetTab = document.getElementById(tabName);
    if (targetTab) {
      targetTab.classList.add('active');
    }
    document.querySelectorAll('.dropdown-link').forEach(link => {
      link.classList.remove('active');
    });
    const activeLink = document.querySelector(`.dropdown-link[data-page="${tabName}"]`);
    if (activeLink) activeLink.classList.add('active');
    document.getElementById('dropdownMenu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
    const scrollablePages = document.getElementById('scrollablePages');
    if (tabName === 'home') {
      scrollablePages.classList.remove('active');
    } else {
      scrollablePages.classList.add('active');
    }
  };

  document.querySelectorAll('.service-title').forEach(title => {
    title.addEventListener('click', function () {
      this.closest('.service-block')?.classList.toggle('expanded');
    });
  });

  const hamburger = document.getElementById('hamburger');
  const navMenu = document.getElementById('dropdownMenu');
  if (hamburger && navMenu) {
    hamburger.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      hamburger.classList.toggle('open');
      navMenu.classList.toggle('open');
    });
  }
});
    </script>
</body>
</html>
